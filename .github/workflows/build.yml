name: Build and Push Docker Images

on:

  push:

    branches:

      - main

  workflow_dispatch:

    inputs:

      commit_sha:

        description: "Optional commit SHA to build only this commit"

        required: false

        type: string

permissions:

  contents: read

jobs:

  detect-changes:

    name: Detect changed microservices

    runs-on: ubuntu-latest

    outputs:

      matrix: ${{ steps.set-matrix.outputs.matrix }}

      any_changed: ${{ steps.set-matrix.outputs.any_changed }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Determine changed services and build matrix

        id: set-matrix

        shell: bash

        run: |
          set -euo pipefail

          TARGET_SHA="${{ github.event.inputs.commit_sha || github.sha }}"

          BASE_SHA="${{ github.event.before }}"

          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${TARGET_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${TARGET_SHA}^")"
            else
              BASE_SHA=""
            fi
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No valid base SHA found. Building all services." >&2
            CHANGED_FILES="$(git ls-files)"
          else
            echo "Detecting changes compared to $BASE_SHA for $TARGET_SHA..." >&2
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA" || true)"
          fi

          echo "Changed files:" >&2
          echo "$CHANGED_FILES" >&2

          MATRIX_INCLUDES=()
          add_entry() { name=$1; context=$2; image=$3; MATRIX_INCLUDES+=("{\"name\":\"$name\",\"context\":\"$context\",\"image\":\"$image\"}"); }

          if echo "$CHANGED_FILES" | grep -q '^AgricultureFront/'; then add_entry "agriculture-front" "./AgricultureFront" "agriculture-front"; fi
          if echo "$CHANGED_FILES" | grep -q '^Gestion-User-Pi-Cloud/'; then add_entry "gestion-user-pi-cloud" "./Gestion-User-Pi-Cloud" "gestion-user-pi-cloud"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Assistance-Service/Assistance-Service/'; then add_entry "assistance-service" "./pi-cloud222/Assistance-Service/Assistance-Service" "assistance-service"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Eureka/'; then add_entry "eureka" "./pi-cloud222/Eureka/eureka" "eureka"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gateway/'; then add_entry "gateway" "./pi-cloud222/Gateway" "gateway"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gestion-Event/'; then add_entry "gestion-event" "./pi-cloud222/Gestion-Event" "gestion-event"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gestion-Formation/'; then add_entry "gestion-formation" "./pi-cloud222/Gestion-Formation/Gestion-Formation" "gestion-formation"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gestion-Pret/'; then add_entry "gestion-pret" "./pi-cloud222/Gestion-Pret" "gestion-pret"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gestion-Reclamation/'; then add_entry "gestion-reclamation" "./pi-cloud222/Gestion-Reclamation" "gestion-reclamation"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gestion-Vente-Location/'; then add_entry "gestion-vente-location" "./pi-cloud222/Gestion-Vente-Location" "gestion-vente-location"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Gestion_Inventory_and_Appointment/'; then add_entry "gestion-inventory-and-appointment" "./pi-cloud222/Gestion_Inventory_and_Appointment" "gestion-inventory-and-appointment"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Livraison/'; then add_entry "livraison" "./pi-cloud222/Livraison/Livraison" "livraison"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/Payment-Service/'; then add_entry "payment-service" "./pi-cloud222/Payment-Service" "payment-service"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/farmer-support/'; then add_entry "farmer-support" "./pi-cloud222/farmer-support/farmer-support" "farmer-support"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/gestion-forum/'; then add_entry "gestion-forum" "./pi-cloud222/gestion-forum/ForumsService" "gestion-forum"; fi
          if echo "$CHANGED_FILES" | grep -q '^pi-cloud222/pi-cloud-Explorer/'; then add_entry "pi-cloud-explorer" "./pi-cloud222/pi-cloud-Explorer/Explorer" "pi-cloud-explorer"; fi

          if [ ${#MATRIX_INCLUDES[@]} -eq 0 ]; then
            echo "No services changed. Skipping build." >&2
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "any_changed=false" >> $GITHUB_OUTPUT
          else
            matrix_json="{\"include\":["
            first=true
            for item in "${MATRIX_INCLUDES[@]}"; do
              if [ "$first" = true ]; then
                matrix_json+="$item"
                first=false
              else
                matrix_json+=",$item"
              fi
            done
            matrix_json+="]}"
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "Matrix generated: $matrix_json" >&2
          fi

  build-and-push:

    name: Build and push ${{ matrix.name }}

    needs: detect-changes

    if: needs.detect-changes.outputs.any_changed == 'true'

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME  }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image

        uses: docker/build-push-action@v5

        with:

          context: ${{ matrix.context }}

          file: ${{ matrix.context }}/Dockerfile

          pull: true

          push: true

          tags: |

            ${{ secrets.DOCKERHUB_USERNAME  }}/${{ matrix.image }}:latest


          cache-from: |

            type=gha

            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

          cache-to: type=gha,mode=max

          build-args: |

            BUILDKIT_INLINE_CACHE=1